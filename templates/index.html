<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>chqn fm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
    }
    h1 { font-size: 1.2rem; letter-spacing: 0.2em; color: #888; }
    #now-playing { text-align: center; line-height: 1.8; }
    #title  { font-size: 1.6rem; font-weight: bold; }
    #artist { font-size: 1.1rem; color: #aaa; }
    #album  { font-size: 0.9rem; color: #666; }
    audio { width: 320px; }
  </style>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2"></script>
</head>
<body>
  <h1>chqn fm</h1>
  <div id="now-playing" hx-ext="sse" sse-connect="/metadata/stream" sse-swap="track">
    {% include "_now_playing.html" %}
  </div>
  <audio controls autoplay>
    <source src="/stream" type="audio/mpeg">
  </audio>
</body>
</html>
