<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>chqn fm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
    }
    h1 { font-size: 1.2rem; letter-spacing: 0.2em; color: #888; }
    #now-playing { text-align: center; line-height: 1.8; }
    #title  { font-size: 1.6rem; font-weight: bold; }
    #artist { font-size: 1.1rem; color: #aaa; }
    #album  { font-size: 0.9rem; color: #666; }
    audio { display: none; }
    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .play-btn:hover  { background: #222; border-color: #555; }
    .play-btn:active { background: #2a2a2a; }
    .play-btn .icon       { width: 22px; height: 22px; fill: currentColor; }
    .play-btn .icon-pause { display: none; }
    .play-btn.playing .icon-play  { display: none; }
    .play-btn.playing .icon-pause { display: block; }
  </style>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2"></script>
</head>
<body>
  <h1>chqn fm</h1>
  <div id="now-playing" hx-ext="sse" sse-connect="/metadata/stream" sse-swap="track">
    {% include "_now_playing.html" %}
  </div>
  <audio id="player" autoplay
    hx-on:play="document.getElementById('play-btn').classList.add('playing')"
    hx-on:pause="document.getElementById('play-btn').classList.remove('playing')">
    <source src="/stream" type="audio/mpeg">
  </audio>

  <button id="play-btn" class="play-btn" aria-label="Play or pause"
    hx-on:click="
      const a = document.getElementById('player');
      if (a.paused) { a.src = '/stream?t=' + Date.now(); a.load(); a.play(); }
      else { a.pause(); }
    ">
    <svg class="icon icon-play"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="icon icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>

  <div hx-get="/queue" hx-trigger="load every 2s"/>

</body>
</html>
