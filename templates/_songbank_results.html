{% for track in results %}
    <tr>
        <td>{{ track.artist }}</td>
        <td>{{ track.album }}</td>
        <td>{{ track.title }}</td>
        <td><button href="/queue/add?title={{ track.title }}&album={{ track.album }}&artist={{ track.artist }}">add to queue</button></td>
    </tr>
{% endfor %}
