{% for track in results %}
    <tr>
        <td>{{ track.artist }}</td>
        <td>{{ track.album }}</td>
        <td>{{ track.title }}</td>
        <td><button hx-post="/queue?title={{ track.title|urlencode }}&album={{ track.album|urlencode }}&artist={{ track.artist|urlencode }}" hx-swap="none">add to queue</button></td>
    </tr>
{% endfor %}
